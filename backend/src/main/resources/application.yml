spring:
  application:
    name: claims
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}
  tomcat:
    # A 0.5 CPU instance cannot use 200 request threads, and each thread handling
    # an upload holds the whole file on the heap. Cap it so concurrency is bounded.
    threads:
      max: ${SERVER_MAX_THREADS:24}
      min-spare: 4
    max-connections: ${SERVER_MAX_CONNECTIONS:200}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /docs
    operations-sorter: method
    tags-sorter: alpha

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false

logging:
  level:
    org.apache.pdfbox.pdmodel.font: ERROR
    org.apache.fontbox: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
