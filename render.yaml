services:
  - type: web
    name: claimguard-api
    runtime: image
    image:
      url: ghcr.io/parandhamareddybommaka/cm-api:latest
    plan: starter
    region: singapore
    numInstances: 1
    healthCheckPath: /api/ping
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://claimguard.vercel.app
      - key: APP_EXPOSE_TECH
        value: "false"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: CLAIM_SCOPE
        value: org
      - key: AUTO_APPROVE_MAX_SCORE
        value: "24"
      - key: DECISION_SLA_HOURS
        value: "24"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: EXTRACTION_WORKERS
        value: "2"
