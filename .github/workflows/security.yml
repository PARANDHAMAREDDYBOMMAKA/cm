name: Security scan

# The OWASP scan needs the full NVD feed (~380k records). That is far too slow
# to sit on the push path, and CVE data changes daily rather than per-commit —
# so it runs on a schedule instead, with the feed cached between runs.
on:
  schedule:
    - cron: '17 3 * * 1'  # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-cve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Rolling cache: the unique key always writes a fresh entry, restore-keys
      # picks up the newest previous one. dependency-check then applies an
      # incremental delta instead of re-downloading all 380k records.
      - name: Cache NVD feed
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Check for known-vulnerable Maven dependencies
        working-directory: backend
        if: env.NVD_API_KEY != ''
        run: ./mvnw -B org.owasp:dependency-check-maven:12.1.0:check -DfailBuildOnCVSS=8 -DnvdApiKey="$NVD_API_KEY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: ignore
